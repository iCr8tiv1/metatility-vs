name: Apply VS v0.2 payload
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply VS v0.2 payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode generalized VS
        shell: bash
        run: |
          cat > /tmp/server.gz.b64 <<'PAYLOAD'

PAYLOAD
          cat > /tmp/index.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/server.gz.b64 | gzip -d > server.mjs
          mkdir -p public
          base64 -d /tmp/index.gz.b64 | gzip -d > public/index.html
          node --check server.mjs
      - name: Commit generalized engine
        shell: bash
        run: |
          git config user.name "metatility-vs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.mjs public/index.html
          git commit -m "Generalize Metatility VS v0.2"
          git push
