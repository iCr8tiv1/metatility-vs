name: Apply VS v0.2 payload
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply VS v0.2 payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct generalized VS
        shell: bash
        run: |
          cat .release/v02/server.part1 .release/v02/server.part2 .release/v02/server.part3 | base64 -d | gzip -d > server.mjs
          cat .release/v02/index.part1 .release/v02/index.part2 .release/v02/index.part3 | base64 -d | gzip -d > public/index.html
          node --check server.mjs
          test "$(grep -c 'Concept Simulation Lab' public/index.html)" -ge 1
          test "$(grep -c "version: '0.2.0'" server.mjs)" -ge 1
      - name: Commit generalized engine
        shell: bash
        run: |
          git config user.name "metatility-vs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.mjs public/index.html
          git commit -m "Generalize Metatility VS v0.2"
          git push
