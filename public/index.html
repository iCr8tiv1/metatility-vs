<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metatility VS</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#15171a;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid #e6e8ec;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:4}.brand{display:flex;align-items:center;gap:11px}.mark{width:34px;height:34px;border:1px solid #15171a;border-radius:9px;display:grid;place-items:center;font-weight:800}.brand b{font-size:16px}.muted{color:#667085}.shell{display:grid;grid-template-columns:210px 1fr;max-width:1450px;margin:auto;min-height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid #e6e8ec;padding:16px 10px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#475467;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#f2f4f7;color:#111;font-weight:650}main{padding:28px}.hero{margin-bottom:20px}.hero h1{margin:4px 0 6px;font-size:32px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#667085;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid #e6e8ec;border-radius:13px;padding:17px}.metric b{display:block;font-size:26px;margin-top:4px}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:14px}.stack{display:grid;gap:9px}.item{border:1px solid #e6e8ec;border-radius:10px;padding:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.score{min-width:38px;height:38px;border-radius:9px;background:#15171a;color:#fff;display:grid;place-items:center;font-weight:800}.assumption{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}.pill{font-size:11px;font-weight:700;padding:4px 7px;border-radius:999px;background:#f2f4f7;color:#475467}.validated{background:#ecfdf3;color:#166534}.testing,.supported{background:#fff7ed;color:#92400e}.invalidated,.contradicted{background:#fef2f2;color:#991b1b}.form{display:grid;gap:9px}.form label{font-size:12px;font-weight:700;color:#475467}.form input,.form select,.form textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:9px;background:#fff}.form textarea{min-height:74px}.btn{border:0;background:#15171a;color:#fff;border-radius:8px;padding:9px 11px;cursor:pointer}.section{display:none}.section.active{display:block}.feed{background:#101828;color:#d0d5dd;padding:12px;border-radius:10px;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;max-height:500px;overflow:auto}.empty{color:#667085;padding:12px 0}.list{border-bottom:1px solid #e6e8ec;padding:10px 0}.list:last-child{border:0}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{position:sticky;top:68px;z-index:3;border-right:0;border-bottom:1px solid #e6e8ec;overflow:auto;padding:7px}.nav{display:flex;min-width:max-content}.nav button{white-space:nowrap}main{padding:18px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.hero h1{font-size:28px}}@media(max-width:500px){.metrics{grid-template-columns:1fr}.top{padding:0 14px}.brand span{display:none}.assumption{grid-template-columns:40px 1fr}.assumption>.pill{grid-column:2}}
</style></head><body><header class="top"><div class="brand"><div class="mark">VS</div><div><b>Metatility Venture Systems</b><span class="muted"> · Shadow Mode</span></div></div><button class="btn" onclick="resetVS()">Reset demo</button></header><div class="shell"><aside><div class="nav" id="nav"></div></aside><main><section id="overview" class="section active"></section><section id="assumptions" class="section"></section><section id="experiments" class="section"></section><section id="evidence" class="section"></section><section id="decisions" class="section"></section><section id="isfeed" class="section"></section></main></div><script>
const tabs=['overview','assumptions','experiments','evidence','decisions','isfeed'];let S,V;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){ $('#nav').innerHTML=tabs.map((x,i)=>`<button data-t="${x}" class="${i?'':'active'}">${x==='isfeed'?'IS Feed':x[0].toUpperCase()+x.slice(1)}</button>`).join('');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>show(b.dataset.t));}function show(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('active',x.dataset.t===id));}async function api(p,o={}){const r=await fetch(p,{headers:{'content-type':'application/json'},...o}),j=await r.json();if(!r.ok)throw Error(j.error);return j;}const hero=(t,d)=>`<div class="hero"><div class="eyebrow">${esc(V.venture.name)} · ${esc(V.venture.stage)}</div><h1>${t}</h1><div class="muted">${d}</div></div>`;const pill=s=>`<span class="pill ${esc(s)}">${esc(s)}</span>`;const ar=a=>`<div class="item assumption"><div class="score">${a.priority}</div><div><b>${esc(a.title)}</b><div class="muted">${esc(a.category)} · Impact ${a.impactIfFalse}/5 · Confidence ${a.confidence}/5 · ${a.evidenceLevel}</div></div>${pill(a.status)}</div>`;
async function load(){S=await api('/api/state');V=S.ventures[0];render();}function render(){const m=V.metrics;$('#overview').innerHTML=hero('Venture Cockpit','Turn assumptions into experiments, evidence, decisions, and institutional knowledge.')+`<div class="metrics"><div class="card metric"><span class="muted">Uncertainty</span><b>${m.uncertaintyIndex}%</b></div><div class="card metric"><span class="muted">Validated</span><b>${m.validated}/${V.assumptions.length}</b></div><div class="card metric"><span class="muted">Active experiments</span><b>${m.activeExperiments}</b></div><div class="card metric"><span class="muted">IS events</span><b id="ec">—</b></div></div><div class="grid"><div class="card"><h2>Priority uncertainties</h2><div class="stack">${V.assumptions.slice(0,5).map(ar).join('')}</div></div><div class="card"><h2>Venture thesis</h2><p>${esc(V.venture.thesis)}</p><div class="muted"><b>Objective:</b> ${esc(V.venture.objective)}</div></div></div>`;api('/api/is-feed').then(x=>$('#ec').textContent=x.events.length);assumptions();experiments();evidence();decisions();feed();}
function assumptions(){$('#assumptions').innerHTML=hero('Assumptions','Rank uncertainty before committing more resources.')+`<div class="card stack">${V.assumptions.map(ar).join('')}</div>`}
function experiments(){$('#experiments').innerHTML=hero('Experiments','Each experiment tests one explicit assumption.')+`<div class="grid"><div class="card"><h2>Register</h2>${V.experiments.length?V.experiments.map(x=>`<div class="list"><div class="row"><b>${esc(x.hypothesis)}</b>${pill(x.status)}</div><div class="muted">${esc(x.method)}</div></div>`).join(''):'<div class="empty">No experiments yet.</div>'}</div><div class="card"><h2>New experiment</h2><form class="form" onsubmit="addExp(event)"><label>Assumption<select name="assumptionId">${V.assumptions.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join('')}</select></label><label>Hypothesis<input name="hypothesis" required></label><label>Method<textarea name="method" required></textarea></label><label>Success condition<input name="successCondition"></label><button class="btn">Create experiment</button></form></div></div>`}async function addExp(e){e.preventDefault();await api('/api/experiments',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await load();show('experiments');}
function evidence(){$('#evidence').innerHTML=hero('Evidence','Observed behavior outranks opinion.')+`<div class="grid"><div class="card"><h2>Register</h2>${V.evidence.length?V.evidence.slice().reverse().map(x=>`<div class="list"><b>${x.level} · ${esc(S.evidenceLevels[x.level].label)}</b><div>${esc(x.summary)}</div><div class="muted">${esc(x.source)}</div></div>`).join(''):'<div class="empty">No observed evidence yet.</div>'}</div><div class="card"><h2>Record evidence</h2><form class="form" onsubmit="addEvi(event)"><label>Assumption<select name="assumptionId">${V.assumptions.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join('')}</select></label><label>Level<select name="level">${Object.entries(S.evidenceLevels).map(([k,v])=>`<option value="${k}">${k} — ${esc(v.label)}</option>`).join('')}</select></label><label>Direction<select name="direction"><option value="supports">Supports</option><option value="neutral">Neutral</option><option value="contradicts">Contradicts</option></select></label><label>Observation<textarea name="summary" required></textarea></label><label>Source<input name="source"></label><button class="btn">Record evidence</button></form></div></div>`}async function addEvi(e){e.preventDefault();await api('/api/evidence',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await load();show('evidence');}
function decisions(){$('#decisions').innerHTML=hero('Decision Ledger','Preserve what was decided and why.')+`<div class="grid"><div class="card"><h2>History</h2>${V.decisions.length?V.decisions.slice().reverse().map(x=>`<div class="list"><b>${esc(x.title)}</b><div>${esc(x.decision)}</div><div class="muted">${esc(x.rationale)}</div></div>`).join(''):'<div class="empty">No decisions yet.</div>'}</div><div class="card"><h2>Record decision</h2><form class="form" onsubmit="addDec(event)"><label>Title<input name="title" required></label><label>Decision<textarea name="decision" required></textarea></label><label>Rationale<textarea name="rationale"></textarea></label><button class="btn">Record decision</button></form></div></div>`}async function addDec(e){e.preventDefault();await api('/api/decisions',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await load();show('decisions');}
async function feed(){const x=await api('/api/is-feed');$('#isfeed').innerHTML=hero('IS Feed','Normalized institutional events ready for Metatility IS ingestion.')+`<div class="card"><div class="row"><h2>Event stream</h2>${pill(x.events.length+' events')}</div><div class="feed">${esc(x.events.length?x.events.map(e=>JSON.stringify(e,null,2)).join('\n\n'):'No events yet.')}</div></div>`}async function resetVS(){if(confirm('Reset the demo?')){await api('/api/reset',{method:'POST',body:'{}'});await load();show('overview')}}nav();load();
</script></body></html>
