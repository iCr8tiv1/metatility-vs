<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metatility VS</title>
<style>
:root{--ink:#101217;--muted:#667085;--line:#e5e7eb;--bg:#f6f7f9;--card:#fff;--soft:#f2f4f7;--good:#166534;--goodbg:#ecfdf3;--warn:#92400e;--warnbg:#fff7ed;--bad:#991b1b;--badbg:#fef2f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:8}.brand{display:flex;align-items:center;gap:10px}.mark{width:35px;height:35px;border:1px solid #111;border-radius:9px;display:grid;place-items:center;font-weight:850;letter-spacing:-.04em}.brand b{font-size:16px}.top-actions{display:flex;gap:8px;align-items:center}.concept-select{min-width:220px;border:1px solid #d0d5dd;border-radius:8px;padding:8px 10px;background:#fff}.shell{display:grid;grid-template-columns:220px 1fr;max-width:1540px;margin:auto;min-height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid var(--line);padding:16px 10px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#475467;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--soft);color:#111;font-weight:650}main{padding:28px}.section{display:none}.section.active{display:block}.hero{margin-bottom:18px}.hero h1{margin:4px 0 6px;font-size:32px;letter-spacing:-.035em}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:750}.muted{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric b{display:block;font-size:26px;margin-top:4px;letter-spacing:-.03em}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.grid.equal{grid-template-columns:1fr 1fr}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stack{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.item{border:1px solid var(--line);border-radius:10px;padding:12px}.item h3,.card h2{margin:0 0 8px}.scorebox{min-width:42px;height:42px;border-radius:10px;background:#15171a;color:#fff;display:grid;place-items:center;font-weight:800}.assumption{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center}.pill{font-size:11px;font-weight:750;padding:4px 7px;border-radius:999px;background:var(--soft);color:#475467;display:inline-block}.validated,.strong{background:var(--goodbg);color:var(--good)}.testing,.supported,.medium{background:var(--warnbg);color:var(--warn)}.invalidated,.contradicted,.high{background:var(--badbg);color:var(--bad)}.form{display:grid;gap:9px}.form label{font-size:12px;font-weight:700;color:#475467}.form input,.form select,.form textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:9px;background:#fff}.form textarea{min-height:72px;resize:vertical}.btn{border:0;background:#15171a;color:#fff;border-radius:8px;padding:9px 11px;cursor:pointer;font-weight:650}.btn.secondary{background:#fff;color:#15171a;border:1px solid #d0d5dd}.btn.small{padding:6px 9px;font-size:12px}.list{border-bottom:1px solid var(--line);padding:10px 0}.list:last-child{border:0}.empty{color:var(--muted);padding:12px 0}.feed{background:#101828;color:#d0d5dd;padding:12px;border-radius:10px;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;max-height:520px;overflow:auto}.concept-card{cursor:pointer;transition:.12s ease}.concept-card:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(16,24,40,.06)}.concept-card.active{border-color:#111}.kicker{font-size:12px;color:var(--muted);font-weight:700}.score-row{display:grid;grid-template-columns:180px 68px 105px 1fr;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.score-row:last-child{border:0}.score-row input,.score-row select{border:1px solid #d0d5dd;border-radius:8px;padding:7px;background:#fff;width:100%}.bar{height:7px;background:#eef0f3;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:#111}.judgment{padding:14px;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}.red{border-left:3px solid #b42318}.amber{border-left:3px solid #b54708}.green{border-left:3px solid #16803d}.sim-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.sim-summary .mini{background:#f8fafc;border:1px solid var(--line);padding:10px;border-radius:9px}.mini b{display:block;font-size:18px;margin-top:3px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}.note{font-size:12px;color:var(--muted)}.afutag{display:inline-flex;gap:4px;margin-top:8px}.afutag span{padding:3px 6px;background:#f2f4f7;border-radius:6px;font-size:11px;font-weight:700}
@media(max-width:980px){.shell{grid-template-columns:1fr}aside{position:sticky;top:68px;z-index:6;border-right:0;border-bottom:1px solid var(--line);overflow:auto;padding:7px}.nav{display:flex;min-width:max-content}.nav button{white-space:nowrap}main{padding:18px}.grid,.grid.equal,.grid3{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.sim-summary{grid-template-columns:1fr 1fr}.score-row{grid-template-columns:1fr 62px 95px}.score-row input{grid-column:1/-1}.hero h1{font-size:28px}}@media(max-width:560px){.top{padding:0 12px}.brand .muted{display:none}.concept-select{min-width:0;max-width:150px}.metrics,.sim-summary{grid-template-columns:1fr}.assumption{grid-template-columns:42px 1fr}.assumption>.pill{grid-column:2}.score-row{grid-template-columns:1fr 60px}.score-row select{grid-column:1/-1}.score-row input{grid-column:1/-1}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark">VS</div><div><b>Metatility Venture Systems</b><span class="muted"> · Concept Simulation Lab</span></div></div><div class="top-actions"><select id="conceptSelect" class="concept-select"></select><button class="btn secondary small" onclick="show('portfolio')">+ Concept</button></div></header>
<div class="shell"><aside><div class="nav" id="nav"></div></aside><main>
<section id="portfolio" class="section active"></section><section id="concept" class="section"></section><section id="scorecard" class="section"></section><section id="assumptions" class="section"></section><section id="experiments" class="section"></section><section id="evidence" class="section"></section><section id="simulator" class="section"></section><section id="decisions" class="section"></section><section id="isfeed" class="section"></section>
</main></div>
<script>
const tabs=['portfolio','concept','scorecard','assumptions','experiments','evidence','simulator','decisions','isfeed'];
let S,V,activeId=null,lastSimulation=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n||0));
function nav(){ $('#nav').innerHTML=tabs.map((x,i)=>`<button data-t="${x}" class="${i?'':'active'}">${x==='isfeed'?'IS Feed':x[0].toUpperCase()+x.slice(1)}</button>`).join('');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>show(b.dataset.t)); }
function show(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('active',x.dataset.t===id));if(id==='isfeed')feed();if(id==='scorecard')redTeam();}
async function api(p,o={}){const r=await fetch(p,{headers:{'content-type':'application/json'},...o}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j;}
const hero=(t,d,portfolio=false)=>`<div class="hero"><div class="eyebrow">${portfolio?'METATILITY VS':`${esc(V.concept.name)} · ${esc(V.concept.type)} · ${esc(V.concept.stage)}`}</div><h1>${esc(t)}</h1><div class="muted">${esc(d)}</div></div>`;
const pill=s=>`<span class="pill ${esc(s)}">${esc(s)}</span>`;
const assumptionRow=a=>`<div class="item assumption"><div class="scorebox">${a.priority}</div><div><b>${esc(a.title)}</b><div class="muted">${esc(a.category)} · Impact ${a.impactIfFalse}/5 · Confidence ${a.confidence}/5 · ${a.evidenceLevel}</div></div>${pill(a.status)}</div>`;
function judgment(sc){if(sc.rawScore>=78&&sc.evidenceCoveragePct<35)return['Attractive thesis, poorly proven','Architecture scores well, but most of the confidence is still assumption-driven. Spend effort on evidence, not polish.'];if(sc.rawScore>=75&&sc.evidenceAdjustedScore>=55)return['Strong candidate for continued validation','The structure and evidence are both developing positively. Continue attacking the highest-consequence unknowns.'];if(sc.rawScore>=60)return['Promising but structurally mixed','There is enough here to keep testing, but weak dimensions should be redesigned before scaling capital.'];return['Needs redesign before additional capital','The current structure has too many weak fundamentals. Improve the architecture before adding execution complexity.'];}
async function load(preferred){S=await api('/api/state');activeId=preferred||activeId||S.concepts[0]?.concept.id;V=S.concepts.find(x=>x.concept.id===activeId)||S.concepts[0];activeId=V?.concept.id;renderSelector();renderAll();}
function renderSelector(){const sel=$('#conceptSelect');sel.innerHTML=S.concepts.map(x=>`<option value="${x.concept.id}" ${x.concept.id===activeId?'selected':''}>${esc(x.concept.name)}</option>`).join('');sel.onchange=async()=>{activeId=sel.value;V=S.concepts.find(x=>x.concept.id===activeId);renderAll();show('concept');};}
function renderAll(){portfolio();concept();scorecard();assumptions();experiments();evidence();simulator();decisions();feed();}
function portfolio(){const cards=S.concepts.map(x=>{const j=judgment(x.scorecard)[0];return `<div class="card concept-card ${x.concept.id===activeId?'active':''}" onclick="selectConcept('${x.concept.id}')"><div class="row"><div><div class="kicker">${esc(x.concept.type)} · ${esc(x.concept.stage)}</div><h2 style="margin:5px 0">${esc(x.concept.name)}</h2></div><span class="scorebox">${x.scorecard.evidenceAdjustedScore}</span></div><p>${esc(x.concept.oneLiner||x.concept.problem)}</p><div class="muted">${esc(j)} · Evidence ${x.scorecard.evidenceCoveragePct}%</div></div>`}).join('');
$('#portfolio').innerHTML=hero('Concept Portfolio','Create, compare, simulate, and pressure-test business ideas before committing meaningful resources.',true)+`<div class="grid3">${cards}</div><div style="height:14px"></div><div class="grid equal"><div class="card"><h2>New concept</h2><form class="form" onsubmit="createConcept(event)"><label>Name<input name="name" placeholder="e.g. Construction intelligence platform" required></label><label>Concept type<select name="type"><option>Business</option><option>Platform</option><option>SaaS</option><option>Marketplace</option><option>Service</option><option>Product</option><option>Data / Intelligence</option><option>Infrastructure</option><option>Asset / Licensing</option><option>Commerce</option><option>Other</option></select></label><label>One-line thesis<input name="oneLiner" placeholder="What is it, in one sentence?"></label><label>Problem<textarea name="problem" placeholder="What painful condition exists?"></textarea></label><label>Target customer<input name="customer" placeholder="Who has the problem and who pays?"></label><label>Proposed solution<textarea name="solution" placeholder="What changes for the customer?"></textarea></label><label>Business model<input name="businessModel" placeholder="Subscription, service, licensing, transaction, etc."></label><label>Distribution<input name="distribution" placeholder="How does it repeatedly reach buyers?"></label><label>Potential advantage<input name="advantage" placeholder="Data, workflow, network, IP, brand, switching cost..."></label><label>Why now?<input name="whyNow"></label><button class="btn">Create concept</button></form></div><div class="card"><h2>VS doctrine</h2><p><b>Architecture is not evidence.</b> VS intentionally separates how attractive a concept looks from how much reality supports it.</p><div class="judgment"><b>Raw architecture score</b><div class="muted">Quality of the current business design, assuming your inputs are true.</div></div><div style="height:8px"></div><div class="judgment"><b>Evidence-adjusted score</b><div class="muted">The same structure discounted by the strength of proof behind each dimension.</div></div><div style="height:8px"></div><div class="judgment"><b>Evidence coverage</b><div class="muted">How much of the weighted model has moved beyond opinion into observed behavior.</div></div></div></div>`;}
async function selectConcept(id){activeId=id;V=S.concepts.find(x=>x.concept.id===id);renderSelector();renderAll();show('concept');}
async function createConcept(e){e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const created=await api('/api/concepts',{method:'POST',body:JSON.stringify(body)});await load(created.concept.id);show('concept');}
function concept(){if(!V)return;const c=V.concept,m=V.metrics,sc=V.scorecard,[j,jd]=judgment(sc);$('#concept').innerHTML=hero(c.name,c.oneLiner||'Concept architecture and current institutional judgment.')+`<div class="metrics"><div class="card metric"><span class="muted">Architecture</span><b>${sc.rawScore}</b></div><div class="card metric"><span class="muted">Evidence-adjusted</span><b>${sc.evidenceAdjustedScore}</b></div><div class="card metric"><span class="muted">Evidence coverage</span><b>${sc.evidenceCoveragePct}%</b></div><div class="card metric"><span class="muted">Critical unknowns</span><b>${m.criticalUnknowns}</b></div></div><div class="grid"><div class="card"><h2>Concept architecture</h2>${[['Problem',c.problem],['Customer',c.customer],['Solution',c.solution],['Business model',c.businessModel],['Distribution',c.distribution],['Advantage',c.advantage],['Why now',c.whyNow]].map(([k,v])=>`<div class="list"><div class="kicker">${k}</div><div>${esc(v||'Not defined')}</div></div>`).join('')}</div><div class="stack"><div class="card"><h2>Preliminary judgment</h2><div class="judgment"><b>${esc(j)}</b><div class="muted" style="margin-top:5px">${esc(jd)}</div></div><div class="afutag"><span>Aesthetics</span><span>Function</span><span>Utility</span></div></div><div class="card"><h2>Next uncertainty</h2>${V.assumptions[0]?assumptionRow(V.assumptions[0]):'<div class="empty">Add assumptions to begin validation.</div>'}</div></div></div>`;}
function scorecard(){if(!V)return;const sc=V.scorecard,[j,jd]=judgment(sc);$('#scorecard').innerHTML=hero('Concept Judgment','Rate the business architecture, then attach the strongest evidence currently available for each dimension.')+`<div class="metrics"><div class="card metric"><span class="muted">Raw architecture</span><b>${sc.rawScore}</b></div><div class="card metric"><span class="muted">Evidence-adjusted</span><b>${sc.evidenceAdjustedScore}</b></div><div class="card metric"><span class="muted">Evidence coverage</span><b>${sc.evidenceCoveragePct}%</b></div><div class="card"><span class="muted">Current read</span><div style="font-weight:750;margin-top:7px">${esc(j)}</div></div></div><div class="grid"><div class="card"><div class="row"><h2>Structural scorecard</h2><button class="btn" onclick="saveScorecard()">Save scorecard</button></div><div id="scoreRows">${sc.dimensions.map(d=>`<div class="score-row" data-key="${d.key}"><div><b>${esc(d.label)}</b><div class="note">Weight ${d.weight}% · ${esc(d.principle)}</div></div><select class="dimscore"><option value="1" ${d.score==1?'selected':''}>1</option><option value="2" ${d.score==2?'selected':''}>2</option><option value="3" ${d.score==3?'selected':''}>3</option><option value="4" ${d.score==4?'selected':''}>4</option><option value="5" ${d.score==5?'selected':''}>5</option></select><select class="dimevidence">${Object.entries(S.evidenceLevels).map(([k,v])=>`<option value="${k}" ${d.evidenceLevel===k?'selected':''}>${k} · ${esc(v.label)}</option>`).join('')}</select><input class="dimnote" value="${esc(d.note||'')}" placeholder="What supports this rating?"></div>`).join('')}</div></div><div class="stack"><div class="card"><h2>Interpretation</h2><div class="judgment"><b>${esc(j)}</b><div class="muted" style="margin-top:6px">${esc(jd)}</div></div><p class="note">This is a decision-support model, not a probability of success. Ratings should fall when evidence contradicts the thesis.</p></div><div class="card" id="redTeam"><h2>Red team</h2><div class="empty">Analyzing structural failure modes…</div></div></div></div>`;}
async function saveScorecard(){const dims={};document.querySelectorAll('#scoreRows .score-row').forEach(r=>dims[r.dataset.key]={score:Number(r.querySelector('.dimscore').value),evidenceLevel:r.querySelector('.dimevidence').value,note:r.querySelector('.dimnote').value});await api('/api/scorecard',{method:'POST',body:JSON.stringify({conceptId:activeId,dimensions:dims})});await load(activeId);show('scorecard');}
async function redTeam(){if(!V)return;const x=await api('/api/red-team?conceptId='+encodeURIComponent(activeId));const el=$('#redTeam');if(!el)return;el.innerHTML='<h2>Red team</h2>'+x.findings.map(f=>`<div class="item ${f.severity==='high'?'red':f.severity==='medium'?'amber':'green'}"><b>${esc(f.title)}</b><div class="muted">${esc(f.detail)}</div></div>`).join('');}
function assumptions(){if(!V)return;$('#assumptions').innerHTML=hero('Assumptions','Decompose the concept into falsifiable beliefs and attack the most consequential uncertainty first.')+`<div class="grid"><div class="card stack">${V.assumptions.length?V.assumptions.map(assumptionRow).join(''):'<div class="empty">No assumptions yet.</div>'}</div><div class="card"><h2>Add assumption</h2><form class="form" onsubmit="addAssumption(event)"><label>Assumption<textarea name="title" required placeholder="What must be true for this concept to work?"></textarea></label><label>Category<input name="category" placeholder="Problem, economics, distribution, technology..."></label><label>Impact if false<select name="impactIfFalse">${[1,2,3,4,5].map(n=>`<option ${n===4?'selected':''}>${n}</option>`).join('')}</select></label><label>Current confidence<select name="confidence">${[1,2,3,4,5].map(n=>`<option ${n===1?'selected':''}>${n}</option>`).join('')}</select></label><label>Cost to test<select name="testCost">${[1,2,3,4,5].map(n=>`<option ${n===2?'selected':''}>${n}</option>`).join('')}</select></label><button class="btn">Add assumption</button></form></div></div>`;}
async function addAssumption(e){e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.conceptId=activeId;await api('/api/assumptions',{method:'POST',body:JSON.stringify(b)});await load(activeId);show('assumptions');}
function experiments(){if(!V)return;$('#experiments').innerHTML=hero('Experiments','Each experiment should remove uncertainty rather than merely produce activity.')+`<div class="grid"><div class="card"><h2>Experiment register</h2>${V.experiments.length?V.experiments.slice().reverse().map(x=>`<div class="list"><div class="row"><b>${esc(x.hypothesis)}</b>${pill(x.status)}</div><div class="muted">${esc(x.method)}</div><div class="note">Pass condition: ${esc(x.successCondition||'Not defined')}</div></div>`).join(''):'<div class="empty">No experiments yet.</div>'}</div><div class="card"><h2>New experiment</h2><form class="form" onsubmit="addExperiment(event)"><label>Assumption<select name="assumptionId">${V.assumptions.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join('')}</select></label><label>Hypothesis<input name="hypothesis" required></label><label>Method<textarea name="method" required></textarea></label><label>Success condition<input name="successCondition"></label><label>Budget<input name="budget" type="number" min="0" value="0"></label><button class="btn">Create experiment</button></form></div></div>`;}
async function addExperiment(e){e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.conceptId=activeId;await api('/api/experiments',{method:'POST',body:JSON.stringify(b)});await load(activeId);show('experiments');}
function evidence(){if(!V)return;$('#evidence').innerHTML=hero('Evidence','Observed behavior outranks stated preference; repeated behavior outranks a single transaction.')+`<div class="grid"><div class="card"><h2>Evidence register</h2>${V.evidence.length?V.evidence.slice().reverse().map(x=>`<div class="list"><b>${x.level} · ${esc(S.evidenceLevels[x.level].label)}</b><div>${esc(x.summary)}</div><div class="muted">${esc(x.direction)} · ${esc(x.source)}</div></div>`).join(''):'<div class="empty">No observed evidence yet.</div>'}</div><div class="card"><h2>Record evidence</h2><form class="form" onsubmit="addEvidence(event)"><label>Assumption<select name="assumptionId">${V.assumptions.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join('')}</select></label><label>Related experiment<select name="experimentId"><option value="">None</option>${V.experiments.map(x=>`<option value="${x.id}">${esc(x.hypothesis)}</option>`).join('')}</select></label><label>Evidence level<select name="level">${Object.entries(S.evidenceLevels).map(([k,v])=>`<option value="${k}">${k} — ${esc(v.label)}</option>`).join('')}</select></label><label>Direction<select name="direction"><option value="supports">Supports</option><option value="neutral">Neutral</option><option value="contradicts">Contradicts</option></select></label><label>Observation<textarea name="summary" required></textarea></label><label>Source<input name="source" placeholder="Interview, analytics, invoice, signed pilot..."></label><button class="btn">Record evidence</button></form></div></div>`;}
async function addEvidence(e){e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.conceptId=activeId;await api('/api/evidence',{method:'POST',body:JSON.stringify(b)});await load(activeId);show('evidence');}
function simulator(){if(!V)return;$('#simulator').innerHTML=hero('Business Simulator','Stress-test the economics of a concept under conservative, base, and upside assumptions. Simulation never becomes evidence.')+`<div class="grid"><div class="card"><h2>Economic model</h2><form class="form" onsubmit="runSimulation(event)"><label>Months<input name="months" type="number" value="24" min="1" max="60"></label><label>Starting active ${esc(V.concept.unitLabel||'unit')}s<input name="startingUnits" type="number" value="0" min="0"></label><label>New ${esc(V.concept.unitLabel||'unit')}s per month<input name="newUnitsPerMonth" type="number" value="10" min="0" step="0.1"></label><label>Revenue per active ${esc(V.concept.unitLabel||'unit')} / month<input name="revenuePerUnit" type="number" value="300" min="0"></label><label>Monthly attrition %<input name="attritionPct" type="number" value="2" min="0" max="95" step="0.1"></label><label>Acquisition cost per new ${esc(V.concept.unitLabel||'unit')}<input name="acquisitionCost" type="number" value="500" min="0"></label><label>Gross margin %<input name="grossMarginPct" type="number" value="75" min="0" max="100"></label><label>Fixed monthly operating cost<input name="fixedMonthlyCost" type="number" value="10000" min="0"></label><button class="btn">Run scenarios</button></form><p class="note">For marketplaces, projects, transactions, licenses, or service accounts, treat the active unit as the recurring economic unit you want to model.</p></div><div class="card" id="simResult"><h2>Scenario output</h2><div class="empty">Run the model to compare downside, base, and upside economics.</div></div></div>`;if(lastSimulation)renderSimulation(lastSimulation);}
async function runSimulation(e){e.preventDefault();lastSimulation=await api('/api/simulate',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});renderSimulation(lastSimulation);}
function renderSimulation(x){const el=$('#simResult');if(!el)return;el.innerHTML='<h2>Scenario output</h2><div class="note">'+esc(x.warning)+'</div>'+x.scenarios.map(s=>`<div class="item" style="margin-top:10px"><div class="row"><b>${s.name}</b>${pill(s.summary.breakEvenMonth?'Break-even M'+s.summary.breakEvenMonth:'No operating break-even')}</div><div class="sim-summary"><div class="mini"><span class="muted">Ending units</span><b>${s.summary.endingUnits}</b></div><div class="mini"><span class="muted">Monthly revenue</span><b>${money(s.summary.endingMonthlyRevenue)}</b></div><div class="mini"><span class="muted">Monthly op. profit</span><b>${money(s.summary.endingOperatingProfit)}</b></div><div class="mini"><span class="muted">Cumulative cash</span><b>${money(s.summary.cumulativeCash)}</b></div><div class="mini"><span class="muted">Break-even</span><b>${s.summary.breakEvenMonth?'M'+s.summary.breakEvenMonth:'—'}</b></div></div></div>`).join('')+`<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Base month</th><th>Units</th><th>Revenue</th><th>Operating profit</th><th>Cumulative cash</th></tr></thead><tbody>${x.scenarios.find(s=>s.name==='Base').rows.filter(r=>r.month===1||r.month%3===0||r.month===x.months).map(r=>`<tr><td>${r.month}</td><td>${r.units}</td><td>${money(r.revenue)}</td><td>${money(r.operatingProfit)}</td><td>${money(r.cumulativeCash)}</td></tr>`).join('')}</tbody></table></div>`;}
function decisions(){if(!V)return;$('#decisions').innerHTML=hero('Decision Ledger','Preserve what was decided, why, and under what evidence state.')+`<div class="grid"><div class="card"><h2>History</h2>${V.decisions.length?V.decisions.slice().reverse().map(x=>`<div class="list"><b>${esc(x.title)}</b><div>${esc(x.decision)}</div><div class="muted">${esc(x.rationale)}</div></div>`).join(''):'<div class="empty">No decisions yet.</div>'}</div><div class="card"><h2>Record decision</h2><form class="form" onsubmit="addDecision(event)"><label>Decision title<input name="title" required></label><label>Decision<textarea name="decision" required></textarea></label><label>Rationale<textarea name="rationale"></textarea></label><label>Review condition<input name="reviewCondition" placeholder="What new evidence should cause a revisit?"></label><button class="btn">Record decision</button></form></div></div>`;}
async function addDecision(e){e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.conceptId=activeId;await api('/api/decisions',{method:'POST',body:JSON.stringify(b)});await load(activeId);show('decisions');}
async function feed(){if(!V)return;const x=await api('/api/is-feed');const el=$('#isfeed');if(!el)return;el.innerHTML=hero('IS Feed','Normalized institutional events from every concept, ready for Metatility IS ingestion.')+`<div class="card"><div class="row"><h2>Event stream</h2>${pill(x.events.length+' events')}</div><div class="feed">${esc(x.events.length?x.events.map(e=>JSON.stringify(e,null,2)).join('\n\n'):'No events yet.')}</div></div>`;}
nav();load();
</script>
</body>
</html>
